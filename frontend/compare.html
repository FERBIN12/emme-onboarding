<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emme — Understand your health plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..400&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   TOKENS
   ═══════════════════════════════════════════════════════════ */
:root{
  --bg:#F1F4EE; --bg-2:#E6EDE3; --surface:#FFFFFF;
  --ink:#14231C; --ink-2:#55685F; --ink-3:#8C9C93;
  --pine:#1C6B4E; --pine-d:#14523B; --pine-soft:#E4F0EA;
  --amber:#9A6A15; --amber-soft:#F8EFDC;
  --clay:#A85039; --clay-soft:#F7E6E1;
  --line:#E2E9DE; --line-2:#CFDACA;

  --sh-1:0 1px 2px rgba(20,35,28,.04), 0 1px 3px rgba(20,35,28,.03);
  --sh-2:0 2px 4px rgba(20,35,28,.03), 0 10px 24px -8px rgba(20,35,28,.09);
  --sh-3:0 4px 8px rgba(20,35,28,.04), 0 24px 48px -16px rgba(20,35,28,.16);

  --display:'Bricolage Grotesque',system-ui,-apple-system,sans-serif;
  --read:'Newsreader',Georgia,serif;
  --util:'Roboto Mono',ui-monospace,monospace;

  --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:26px;
  --e:cubic-bezier(.22,.68,.32,1);
  --e-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);font-family:var(--display);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;min-height:100vh;
}

/* ═══════════════════════════════════════════════════════════
   TYPE
   ═══════════════════════════════════════════════════════════ */
h1{font-size:clamp(28px,4.2vw,40px);line-height:1.06;letter-spacing:-.035em;font-weight:700}
h2{font-size:clamp(19px,2.4vw,23px);line-height:1.15;letter-spacing:-.024em;font-weight:700}
h3{font-size:16px;line-height:1.25;letter-spacing:-.012em;font-weight:700}
.say{font-family:var(--read);font-size:17px;line-height:1.58;color:var(--ink-2)}
.say-sm{font-family:var(--read);font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.eyebrow{font-family:var(--util);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.038em;font-weight:700}
.lede{max-width:56ch}

/* ═══════════════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════════════ */
header{
  position:sticky;top:0;z-index:40;
  background:rgba(241,244,238,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s;
}
header.stuck{border-bottom-color:var(--line);box-shadow:0 1px 12px rgba(20,35,28,.04)}
header.hidden{display:none}
.hd{max-width:1100px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:14px}
.logo{
  display:flex;align-items:center;gap:9px;background:none;border:0;cursor:pointer;
  font-family:var(--util);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--pine);padding:6px 4px;border-radius:var(--r-sm);
}
.logo .glyph{
  width:22px;height:22px;border-radius:7px;background:var(--pine);position:relative;flex:none;
  transition:transform .4s var(--e-out);
}
.logo .glyph::after{
  content:'';position:absolute;inset:6px 5px;border-radius:2px;
  background:linear-gradient(to top,#fff 0 42%,transparent 42%);
}
.logo:hover .glyph{transform:rotate(-8deg) scale(1.06)}
nav{margin-left:auto;display:flex;align-items:center;gap:2px}
nav button{
  font-family:var(--display);font-size:14px;font-weight:500;color:var(--ink-2);
  background:none;border:0;padding:9px 14px;border-radius:var(--r-sm);cursor:pointer;
  transition:color .18s,background .18s;position:relative;
}
nav button:hover{color:var(--ink);background:var(--bg-2)}
nav button.on{color:var(--ink)}
nav button.on::after{
  content:'';position:absolute;left:14px;right:14px;bottom:3px;height:2px;
  background:var(--pine);border-radius:2px;animation:grow .34s var(--e-out) both;
}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ═══════════════════════════════════════════════════════════
   LAYOUT + PAGE TRANSITION
   ═══════════════════════════════════════════════════════════ */
main{max-width:1100px;margin:0 auto;padding:34px 24px 96px}
main.narrow{max-width:470px}

.howitworks{display:none}
@media(min-width:1020px){
  .page-layout{display:flex;gap:48px;align-items:flex-start;justify-content:center;max-width:1100px;margin:0 auto;padding:34px 24px 96px}
  .page-layout main{margin:0;padding:0;flex:0 0 auto}
  .howitworks{flex:0 0 380px;position:sticky;top:34px}
  .howitworks video{width:100%;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.14);display:block}
  .howitworks h3{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 12px}
  .howitworks.show{display:block}
}
.view{display:none}
.view.active{display:block;animation:enter .42s var(--e-out) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stagger>*{animation:enter .5s var(--e-out) both}
.stagger>*:nth-child(1){animation-delay:.04s}
.stagger>*:nth-child(2){animation-delay:.10s}
.stagger>*:nth-child(3){animation-delay:.16s}
.stagger>*:nth-child(4){animation-delay:.22s}
.stagger>*:nth-child(5){animation-delay:.28s}
.stagger>*:nth-child(6){animation-delay:.34s}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:38px 0 14px}

/* ═══════════════════════════════════════════════════════════
   SURFACES
   ═══════════════════════════════════════════════════════════ */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:22px;box-shadow:var(--sh-1);transition:box-shadow .3s var(--e),transform .3s var(--e),border-color .25s;
}
.card.lift:hover{box-shadow:var(--sh-2);transform:translateY(-2px);border-color:var(--line-2)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(256px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}

/* ═══════════════════════════════════════════════════════════
   CONTROLS
   ═══════════════════════════════════════════════════════════ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:-.012em;
  padding:14px 22px;border-radius:var(--r);border:1px solid transparent;cursor:pointer;
  background:var(--pine);color:#fff;box-shadow:var(--sh-1);
  transition:background .18s,transform .16s var(--e),box-shadow .22s;
}
.btn:hover{background:var(--pine-d);transform:translateY(-1.5px);box-shadow:var(--sh-2)}
.btn:active{transform:translateY(0) scale(.99);box-shadow:var(--sh-1)}
.btn.wide{width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface);border-color:var(--line-2)}
.btn.quiet{background:none;color:var(--ink-2);box-shadow:none;font-weight:500;font-size:14px;padding:11px 14px}
.btn.quiet:hover{background:var(--bg-2);color:var(--ink);transform:none;box-shadow:none}
.btn.sm{font-size:13.5px;padding:10px 16px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn .arw{transition:transform .24s var(--e-out)}
.btn:hover .arw{transform:translateX(3px)}
.stack{display:flex;flex-direction:column;gap:10px}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap}
.rowbtns .btn{flex:1;min-width:130px}

input,textarea{
  font-family:var(--display);font-size:16px;color:var(--ink);width:100%;
  border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;background:var(--bg);
  transition:border-color .2s,background .2s,box-shadow .2s;
}
input:focus,textarea:focus{outline:none;border-color:var(--pine);background:var(--surface);box-shadow:0 0 0 3px var(--pine-soft)}
input::placeholder{color:var(--ink-3)}
label.lbl{display:block;font-family:var(--util);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
:focus-visible{outline:2px solid var(--pine);outline-offset:3px;border-radius:4px}

/* ═══════════════════════════════════════════════════════════
   CONFIDENCE TOKEN
   ═══════════════════════════════════════════════════════════ */
.dot{width:15px;height:15px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;position:relative}
.dot.v{background:var(--pine)}
.dot.v::after{content:'';width:6px;height:3px;border-left:1.8px solid #fff;border-bottom:1.8px solid #fff;transform:rotate(-45deg) translate(.5px,-.5px)}
.dot.c{border:2px solid var(--amber);background:var(--amber-soft)}
.dot.m{border:1.5px dashed var(--clay)}
.dot.pop{animation:pop .34s var(--e-out) both}
@keyframes pop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.22)}100%{transform:scale(1);opacity:1}}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 8px;border-radius:99px;font-family:var(--util);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase}
.chip.v{background:var(--pine-soft);color:var(--pine)}
.chip.c{background:var(--amber-soft);color:var(--amber)}
.chip.m{background:var(--clay-soft);color:var(--clay)}
.source{font-family:var(--util);font-size:11px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:14px;margin-top:18px;display:flex;align-items:center;gap:8px}

/* ═══════════════════════════════════════════════════════════
   HOME
   ═══════════════════════════════════════════════════════════ */
.hero{padding:20px 0 8px}
.hero h1{margin-bottom:14px}
.tile{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;
  cursor:pointer;text-align:left;width:100%;font-family:inherit;color:inherit;
  box-shadow:var(--sh-1);transition:box-shadow .3s var(--e),transform .3s var(--e),border-color .25s;
  display:flex;flex-direction:column;gap:9px;
}
.tile:hover{box-shadow:var(--sh-2);transform:translateY(-3px);border-color:var(--line-2)}
.tile .ico{
  width:38px;height:38px;border-radius:11px;background:var(--pine-soft);color:var(--pine);
  display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:3px;
  transition:transform .32s var(--e-out);
}
.tile:hover .ico{transform:scale(1.08) rotate(-4deg)}
.tile .go{font-family:var(--util);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--pine);margin-top:auto;padding-top:6px}

/* ═══════════════════════════════════════════════════════════
   DARK PANEL (snapshot / dial)
   ═══════════════════════════════════════════════════════════ */
.panel{background:var(--ink);color:#fff;border-radius:var(--r-xl);padding:26px;box-shadow:var(--sh-2)}
.panel .eyebrow{color:#8DAE9E}
.panel .hero-n{font-size:clamp(36px,5.6vw,50px);line-height:1;margin:16px 0 7px}
.panel .hero-l{font-family:var(--read);font-size:15.5px;color:#A6C0B3;max-width:44ch;line-height:1.45}
.meter{margin-top:20px}
.meter-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.meter-t .l{font-size:13.5px;font-weight:600;color:#D4E2DB}
.meter-t .v{font-family:var(--util);font-size:11.5px;color:#8DAE9E;font-variant-numeric:tabular-nums}
.track{height:8px;background:rgba(255,255,255,.13);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;width:0;transition:width 1.1s var(--e-out)}
.fill.a{background:#5FD3A0}.fill.b{background:#E8C46B}
.cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:rgba(255,255,255,.12);border-radius:var(--r);overflow:hidden;margin-top:22px}
.cell{background:var(--ink);padding:15px 16px}
.cell .l{font-family:var(--util);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#8DAE9E;margin-bottom:6px}
.cell .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.025em}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;background:none;height:26px;cursor:grab;padding:0;border:0;
}
input[type=range]:active{cursor:grabbing}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:rgba(255,255,255,.15);border-radius:99px}
input[type=range]::-moz-range-track{height:6px;background:rgba(255,255,255,.15);border-radius:99px}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-8px;
  box-shadow:0 2px 8px rgba(0,0,0,.3);transition:transform .18s var(--e-out);
}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.14)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.scale{display:flex;justify-content:space-between;font-family:var(--util);font-size:10.5px;color:#8DAE9E;margin-top:2px}
.presets{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.preset{
  font-family:var(--display);font-size:13px;font-weight:500;padding:9px 15px;border-radius:99px;
  background:rgba(255,255,255,.09);color:#D4E2DB;border:1px solid rgba(255,255,255,.15);cursor:pointer;
  transition:all .2s var(--e);
}
.preset:hover{background:rgba(255,255,255,.17);transform:translateY(-1px)}
.preset.on{background:#5FD3A0;color:#0B2E22;border-color:#5FD3A0}

/* ═══════════════════════════════════════════════════════════
   ONBOARDING
   ═══════════════════════════════════════════════════════════ */
.rail{margin-bottom:26px}
.rail-t{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rail-track{height:3px;background:var(--bg-2);border-radius:99px;overflow:hidden}
.rail-fill{height:100%;background:var(--pine);width:0;border-radius:99px;transition:width .6s var(--e-out)}
.drop{
  border:1.5px dashed var(--line-2);border-radius:var(--r-lg);background:var(--surface);
  padding:44px 24px;text-align:center;cursor:pointer;width:100%;font-family:inherit;color:inherit;
  transition:border-color .25s,background .25s,transform .25s var(--e);
}
.drop:hover,.drop.over{border-color:var(--pine);background:var(--pine-soft);transform:translateY(-2px)}
.drop .ic{font-size:26px;color:var(--ink-3);margin-bottom:12px;display:block}
.proc-l{display:flex;align-items:center;gap:14px;font-family:var(--read);font-size:17.5px;color:var(--ink-3);margin-bottom:16px;opacity:.32;transition:opacity .45s var(--e),color .45s}
.proc-l.on{opacity:1;color:var(--ink)}
.spin{width:15px;height:15px;flex:none;border-radius:50%;border:2px solid var(--bg-2);border-top-color:var(--pine);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tally{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-1)}
.tally-r{display:flex;align-items:center;gap:13px;background:var(--surface);padding:16px 18px}
.tally-r+.tally-r{border-top:1px solid var(--line)}
.big-v{font-size:clamp(38px,7vw,50px);line-height:1.04;margin:6px 0 16px}
.big-v input{font-size:inherit;font-weight:700;letter-spacing:-.038em;border:0;border-bottom:2px solid var(--pine);border-radius:0;background:none;padding:0 0 6px;box-shadow:none}
.big-v input:focus{box-shadow:none}
.q-in{font-size:clamp(26px,5vw,34px);font-weight:700;letter-spacing:-.032em;border:0;border-bottom:2px solid var(--line);border-radius:0;background:none;padding:6px 0 10px}
.q-in:focus{box-shadow:none;border-bottom-color:var(--pine)}
details.help{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
details.help summary{cursor:pointer;list-style:none;font-family:var(--util);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--pine);display:flex;align-items:center}
details.help summary::-webkit-details-marker{display:none}
details.help summary::after{content:'+';margin-left:auto;font-size:15px;transition:transform .25s var(--e)}
details.help[open] summary::after{transform:rotate(45deg)}
details.help .bd{margin-top:13px;animation:enter .3s var(--e-out) both}
.where{background:var(--bg);border-radius:var(--r);padding:14px 16px}
.where li{font-family:var(--read);font-size:15px;color:var(--ink-2);list-style:none;padding:3px 0 3px 15px;position:relative}
.where li::before{content:'';position:absolute;left:2px;top:13px;width:5px;height:1px;background:var(--ink-3)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:13px;padding:5px 12px;border-radius:99px;background:var(--bg);color:var(--ink-2);border:1px solid var(--line)}
.callout{font-family:var(--read);font-size:15px;color:var(--clay);background:var(--clay-soft);border-radius:var(--r-sm);padding:11px 14px}
.choices{display:flex;gap:10px}
.choice{flex:1;padding:16px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);font-family:var(--display);font-size:15px;font-weight:600;cursor:pointer;transition:all .18s var(--e)}
.choice:hover{border-color:var(--line-2);transform:translateY(-1px)}
.choice.sel{border-color:var(--pine);background:var(--pine-soft);color:var(--pine)}

/* ═══════════════════════════════════════════════════════════
   COVERAGE + COMPARE
   ═══════════════════════════════════════════════════════════ */
.cov{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--sh-1);transition:transform .25s var(--e),box-shadow .25s}
.cov:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.cov .l{font-size:13px;color:var(--ink-2);font-weight:600;margin-bottom:8px;line-height:1.3}
.cov .v{font-size:25px;font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.cov.gap{border-style:dashed;border-color:#C7ADA4;background:transparent;box-shadow:none;cursor:pointer}
.cov.gap:hover{background:var(--clay-soft)}
.cov.gap .v{color:var(--clay);font-size:15px;letter-spacing:0;font-weight:600}
.plan{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--sh-1);transition:transform .3s var(--e),box-shadow .3s}
.plan:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
.plan.you{border:2px solid var(--ink)}
.plan.best{border:2px solid var(--pine)}
.tag{position:absolute;top:-10px;left:20px;font-family:var(--util);font-size:10px;letter-spacing:.09em;text-transform:uppercase;padding:4px 11px;border-radius:99px;color:#fff}
.plan .tot{font-size:32px;margin:16px 0 2px}
.rows{border-top:1px solid var(--line);padding-top:13px;margin-top:14px}
.row{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}
.row .k{color:var(--ink-2)}
.row .v{font-variant-numeric:tabular-nums;font-weight:600}
.chart-line{stroke-dasharray:2600;stroke-dashoffset:2600;animation:draw 1.3s var(--e-out) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}
.leg{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
.sw{width:15px;height:3px;border-radius:2px;flex:none}
.notice{font-family:var(--read);font-size:15.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:0 var(--r) var(--r) 0;padding:16px 20px;line-height:1.55}

/* ═══════════════════════════════════════════════════════════
   CHAT
   ═══════════════════════════════════════════════════════════ */
.fab{
  position:fixed;right:22px;bottom:22px;z-index:60;background:var(--ink);color:#fff;border:0;
  border-radius:99px;padding:15px 24px;font-family:var(--display);font-size:15px;font-weight:600;
  cursor:pointer;box-shadow:var(--sh-3);display:flex;align-items:center;gap:9px;
  transition:transform .24s var(--e-out),opacity .2s;
}
.fab:hover{transform:translateY(-3px) scale(1.02)}
.fab.gone{opacity:0;transform:scale(.9);pointer-events:none}
.chat{
  position:fixed;right:22px;bottom:22px;z-index:61;width:384px;max-width:calc(100vw - 32px);
  height:min(568px,calc(100vh - 44px));background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-xl);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh-3);
  opacity:0;transform:translateY(16px) scale(.97);pointer-events:none;
  transition:opacity .26s var(--e-out),transform .3s var(--e-out);
}
.chat.open{opacity:1;transform:none;pointer-events:auto}
.chat-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--pine);position:relative}
.pulse::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--pine);animation:ping 2.2s var(--e-out) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.6}80%,100%{transform:scale(2.6);opacity:0}}
.chat-h .x{margin-left:auto;background:none;border:0;font-size:22px;color:var(--ink-3);cursor:pointer;line-height:1;padding:2px 6px;border-radius:7px;transition:.18s}
.chat-h .x:hover{background:var(--bg-2);color:var(--ink)}
.log{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:13px}
.msg{max-width:87%;font-size:14.5px;line-height:1.55;padding:12px 15px;border-radius:16px;animation:enter .34s var(--e-out) both}
.msg.u{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:5px}
.msg.a{align-self:flex-start;background:var(--bg);font-family:var(--read);font-size:15.5px;border-bottom-left-radius:5px}
.typing{display:flex;gap:4px;align-items:center;padding:15px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:bob 1.3s infinite}
.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.suggs{display:flex;flex-wrap:wrap;gap:7px;padding:0 20px 14px}
.sugg{font-size:12.5px;padding:8px 13px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;text-align:left;transition:.18s}
.sugg:hover{border-color:var(--pine);color:var(--pine);transform:translateY(-1px)}
.chat-in{border-top:1px solid var(--line);padding:13px;display:flex;gap:9px}
.chat-in input{font-size:14.5px;padding:12px 14px}
.chat-in button{background:var(--pine);color:#fff;border:0;border-radius:var(--r);padding:0 18px;cursor:pointer;font-size:17px;transition:background .18s,transform .16s}
.chat-in button:hover{background:var(--pine-d);transform:scale(1.04)}
.chat-f{font-family:var(--util);font-size:9.5px;color:var(--ink-3);text-align:center;padding:0 14px 12px;line-height:1.6}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,16px);z-index:70;
  background:var(--ink);color:#fff;font-family:var(--util);font-size:10.5px;letter-spacing:.11em;
  text-transform:uppercase;padding:11px 20px;border-radius:99px;opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:9px;box-shadow:var(--sh-2);
  transition:opacity .3s,transform .34s var(--e-out);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast::before{content:'';width:6px;height:6px;border-radius:50%;background:#5FD3A0}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
@media(max-width:600px){
  .hd{padding:12px 18px}
  main{padding:26px 18px 96px}
  nav button{padding:8px 10px;font-size:13.5px}
  .fab{right:16px;bottom:16px;padding:14px 20px}
  .chat{right:16px;bottom:16px}
}
</style>
</head>
<body>

<header id="hdr" class="hidden">
  <div class="hd">
    <button class="logo" data-nav="home" aria-label="Emme home"><span class="glyph"></span>Emme</button>
    <nav>
      <button data-nav="home">Home</button>
      <button data-nav="plan">Your plan</button>
      <button data-nav="compare">Compare</button>
      <button data-nav="logout">Sign out</button>
    </nav>
  </div>
</header>

<div class="page-layout">
  <main id="main"><div id="views"></div></main>
  <aside class="howitworks" id="howitworks">
    <h3>How it works</h3>
    <video src="how-it-works.mp4" controls playsinline preload="metadata"></video>
  </aside>
</div>

<button class="fab gone" id="fab"><span class="pulse"></span>Ask Emme</button>

<div class="chat" id="chat" role="dialog" aria-label="Insurance assistant">
  <div class="chat-h">
    <span class="pulse"></span><h3>Ask Emme</h3>
    <button class="x" id="chatX" aria-label="Close">×</button>
  </div>
  <div class="log" id="log"></div>
  <div class="suggs" id="suggs"></div>
  <div class="chat-in">
    <input id="chatIn" placeholder="What's a deductible?" aria-label="Message">
    <button id="chatSend" aria-label="Send">→</button>
  </div>
  <p class="chat-f">Explanations only — not medical, legal or enrolment advice.</p>
</div>

<div class="toast" id="toast">Saved</div>

<script>
/* ════════════════════════════════════════════════════════════════════════
   Emme — single-file build. Opens straight from disk, no server required.
   Set API.mode = 'live' to route through server.py instead of local demo.
   ════════════════════════════════════════════════════════════════════════ */
const API = { mode:'live', base:'https://emme-onboarding.onrender.com' };

const FIELDS = {
  carrier:{l:'Insurance company'}, plan_name:{l:'Plan name'}, plan_type:{l:'Plan type'},
  monthly_premium:{l:'Monthly premium',f:'money',
    say:'What you pay every month to keep your coverage active — whether or not you see a doctor.',
    q:'What do you pay each month for this plan?',
    w:["Your employer's benefits portal","Your insurance account","Your payslip, under deductions"]},
  deductible_individual:{l:'Individual deductible',f:'money',
    say:'The amount you pay yourself before your insurance starts sharing the cost of most covered care.'},
  deductible_used:{l:'Deductible used',f:'money',say:'How much of your deductible you have already paid this year.'},
  oop_max_individual:{l:'Out-of-pocket maximum',f:'money',say:'The most you will pay for covered care this year.'},
  oop_spent:{l:'Spent toward maximum',f:'money'},
  coinsurance:{l:'Your share after the deductible',f:'pct',
    say:'Once your deductible is paid, you and your plan split the bill. 20% means you pay 20 and your plan pays 80.'},
  copay_primary:{l:'Regular doctor visit',f:'money',say:'A flat fee you pay when you see your usual doctor.'},
  copay_specialist:{l:'Specialist visit',f:'money',say:'What you pay to see a specialist — a dermatologist, cardiologist, and so on.'},
  copay_urgent_care:{l:'Urgent care',f:'money',say:'What a walk-in urgent care visit costs you.'},
  copay_er:{l:'Emergency room',f:'money',say:'What an emergency room visit costs you.',
    q:'What do you pay at the emergency room?',w:['Page 2 of your SBC']},
  rx_generic:{l:'Generic prescriptions',f:'money'},
  hsa_eligible:{l:'Health Savings Account',f:'bool',
    say:'An HSA lets you set aside money for medical costs before tax. Only certain plans allow one.',
    q:'Can you put money into a Health Savings Account?',w:['Your benefits portal','Your enrolment paperwork']}
};

const seed = (v,c,d,p)=>({value:v,confidence:c,source:d?{doc_type:d,page:p}:null});
const EXTRACTED = {
  session_id:'demo', updated_at:new Date().toISOString(), source_documents:[],
  fields:{
    carrier:seed('Blue Cross Blue Shield','verified','SBC',1),
    plan_name:seed('Gold PPO','verified','SBC',1),
    plan_type:seed('PPO','verified','SBC',1),
    deductible_individual:seed(2000,'verified','SBC',2),
    deductible_used:seed(650,'verified','EOB',1),
    oop_max_individual:seed(6500,'verified','SBC',2),
    oop_spent:seed(940,'verified','EOB',1),
    copay_primary:seed(25,'verified','SBC',3),
    copay_urgent_care:seed(75,'verified','SBC',3),
    rx_generic:seed(10,'verified','SBC',5),
    coinsurance:seed(20,'needs_confirmation','SBC',2),
    copay_specialist:seed(50,'needs_confirmation','SBC',3),
    monthly_premium:seed(null,'missing'),
    hsa_eligible:seed(null,'missing'),
    copay_er:seed(null,'missing')
  }
};

let PLAN=null, view='login', step=0, confQ=[], ci=0, manQ=[], mi=0, editing=false, picked=null, spend=3000, pickedFile=null;

const V=document.getElementById('views'), HDR=document.getElementById('hdr'), MAIN=document.getElementById('main');
const money=n=>'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=(k,v)=>{ if(v==null||v==='')return '—';
  const f=FIELDS[k]?.f; return f==='money'?money(v):f==='pct'?v+'%':f==='bool'?(v?'Yes':'No'):v; };
const val=k=>PLAN?.fields[k]?.value;
const has=k=>val(k)!=null&&val(k)!=='';

// Type-aware parsing for manual entry / edited confirm-card values.
// Text fields (carrier, plan_name, plan_type, network -- anything with
// no FIELDS[k].f) must stay strings; forcing Number() on them silently
// strips every letter and corrupts the value (e.g. "Blue Cross" -> null).
// Money fields are floats rounded to 2dp, never integers.
function parseFieldValue(meta, raw){
  const f=meta?.f;
  if(f==='money'||f==='pct'){
    const cleaned=String(raw).replace(/[^0-9.]/g,'');
    if(cleaned==='') return null;
    const n=Number(cleaned);
    return Number.isFinite(n) ? Math.round(n*100)/100 : null;
  }
  const trimmed=String(raw).trim();
  return trimmed===''?null:trimmed;
}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const wait=ms=>new Promise(r=>setTimeout(r,ms));

const Store={ k:'emme.v2', m:null,
  save(p){ this.m=p; try{localStorage.setItem(this.k,JSON.stringify(p))}catch(e){} },
  load(){ try{const r=localStorage.getItem(this.k); if(r)return JSON.parse(r)}catch(e){} return this.m },
  clear(){ this.m=null; try{localStorage.removeItem(this.k)}catch(e){} } };

let tt; function toast(m='Saved'){ const t=document.getElementById('toast');
  t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1700); }
async function persist(){ if(!PLAN)return; PLAN.updated_at=new Date().toISOString(); Store.save(PLAN);
  if(API.mode==='live'){ try{ await fetch(API.base+'/api/plan',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(PLAN),credentials:'include'}) }catch(e){} }
  toast(); }

/* ── router ─────────────────────────────────────────────── */
function go(v){ view=v; window.scrollTo({top:0,behavior:'auto'}); render(); }
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{
  const n=b.dataset.nav;
  if(n==='logout'){ Store.clear(); PLAN=null; step=0; ci=0; mi=0; go('login'); return; }
  if(n==='plan'){ if(!PLAN){ step=0; return go('onboard'); } return go('dash'); }
  go(n==='home'?'home':n==='compare'?'compare':'home');
});
addEventListener('scroll',()=>HDR.classList.toggle('stuck',scrollY>6),{passive:true});

function render(){
  HDR.classList.toggle('hidden', view==='login');
  MAIN.classList.toggle('narrow', view==='login'||view==='onboard');
  document.getElementById('howitworks').classList.toggle('show', view==='login'||view==='home');
  document.querySelectorAll('nav [data-nav]').forEach(b=>b.classList.toggle('on',
    (b.dataset.nav==='home'&&view==='home')||
    (b.dataset.nav==='plan'&&(view==='dash'||view==='onboard'))||
    (b.dataset.nav==='compare'&&view==='compare')));
  document.getElementById('fab').classList.toggle('gone', view==='login'||view==='onboard'||document.getElementById('chat').classList.contains('open'));

  const fn={login:vLogin,home:vHome,onboard:vOnboard,dash:vDash,compare:vCompare}[view];
  V.innerHTML='<div class="view active">'+fn()+'</div>';
  wire();
  if(view==='dash') animateDash();
  if(view==='onboard'&&step===3) runProc();
}

/* ── login ──────────────────────────────────────────────── */
let loginErr='', signupMode=false;
function vLogin(){ return `
  <div style="padding:8vh 0 0">
    <div class="stagger">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:34px">
        <span class="glyph" style="width:26px;height:26px;border-radius:8px;background:var(--pine);position:relative;display:inline-block"></span>
        <span style="font-family:var(--util);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--pine)">Emme</span>
      </div>
      <h1>${signupMode?'Create your account.':'Welcome back.'}</h1>
      <p class="say" style="margin:14px 0 28px">Your plan, your numbers, and an assistant that explains them in plain English.</p>
      <div class="card">
        <label class="lbl" for="u">Username</label>
        <input id="u" placeholder="username" autocomplete="username">
        <div style="height:16px"></div>
        <label class="lbl" for="p">Password</label>
        <input id="p" type="password" placeholder="${signupMode?'at least 6 characters':'••••••••'}" autocomplete="${signupMode?'new-password':'current-password'}">
        <div style="height:22px"></div>
        <button class="btn wide" data-act="${signupMode?'signup':'login'}">${signupMode?'Create account':'Sign in'} <span class="arw">→</span></button>
        ${loginErr?`<div class="callout" style="margin-top:16px">${esc(loginErr)}</div>`:''}
        <button class="btn quiet wide" style="margin-top:14px" data-act="toggleSignup">${signupMode?'Already have an account? Sign in':"New here? Create an account"}</button>
      </div>
    </div>
  </div>`; }

/* ── home ───────────────────────────────────────────────── */
function vHome(){
  const done = !!PLAN;
  const rem = done&&has('deductible_individual') ? Math.max(0, val('deductible_individual')-(val('deductible_used')||0)) : null;
  return `
  <div class="stagger">
    <div class="hero">
      <span class="eyebrow">Good to see you</span>
      <h1 style="margin-top:12px">${done?'Here\'s where your plan stands.':'Let\'s make sense of your plan.'}</h1>
      <p class="say lede" style="margin-top:14px">${done
        ? 'Everything we read from your documents, organised in one place — plus how your plan stacks up against the alternatives.'
        : 'Upload your insurance documents or answer a few simple questions. It takes about two minutes, and you can stop and come back any time.'}</p>
    </div>
    ${done?`
    <div class="panel" style="margin-top:24px">
      <span class="eyebrow">Deductible remaining</span>
      <div class="hero-n num">${rem!=null?money(rem):'—'}</div>
      <p class="hero-l">before your plan starts sharing more of the cost of your care</p>
    </div>`:''}
    <div class="grid g3" style="margin-top:${done?'14px':'26px'}">
      <button class="tile" data-act="goplan">
        <span class="ico">◈</span>
        <h3>${done?'Your plan':'Set up your plan'}</h3>
        <p class="say-sm">${done?'Deductible, copays and coverage, all in plain language.':'Two minutes. Upload documents or answer questions.'}</p>
        <span class="go">${done?'Open dashboard →':'Start setup →'}</span>
      </button>
      <button class="tile" data-act="gocompare">
        <span class="ico">◐</span>
        <h3>Compare plans</h3>
        <p class="say-sm">See where your plan wins and where it loses, based on how much care you use.</p>
        <span class="go">Compare →</span>
      </button>
      <button class="tile" data-act="gochat">
        <span class="ico">✳</span>
        <h3>Ask a question</h3>
        <p class="say-sm">Deductibles, coinsurance, HSAs — explained without the jargon.</p>
        <span class="go">Open assistant →</span>
      </button>
    </div>
  </div>`; }

/* ── onboarding ─────────────────────────────────────────── */
const STEPS=['','Your documents','Upload','Reading','What we found','Confirming','Details'];
const PROC=['Finding your plan…','Reading your deductible…','Checking your benefits…','Organising your information…'];

function rail(pct,label){ return `
  <div class="rail">
    <div class="rail-t">
      <button class="btn quiet" style="padding:4px 0;font-family:var(--util);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase" data-act="back">← Back</button>
      <span class="eyebrow">${label}</span>
    </div>
    <div class="rail-track"><div class="rail-fill" style="width:${pct}%"></div></div>
  </div>`; }

function vOnboard(){
  if(step===0) return `<div style="padding:6vh 0 0" class="stagger">
    <h1>Understand your health plan in minutes.</h1>
    <p class="say" style="margin:16px 0 30px">Upload your insurance documents or answer a few simple questions. We'll organise everything into one dashboard you can actually read.</p>
    <div class="stack">
      <button class="btn wide" data-act="step" data-v="1">Upload my documents <span class="arw">→</span></button>
      <button class="btn ghost wide" data-act="manual">Enter information manually</button>
    </div>
    <p class="say-sm" style="text-align:center;margin-top:20px">No documents? No problem — you can stop and come back any time.</p></div>`;

  if(step===1) return rail(16,'Your documents')+`<div class="stagger">
    <h1>Two documents do most of the work.</h1>
    <p class="say" style="margin:14px 0 22px">Here's what each one is and where people usually find it. You only need one to get started.</p>
    <div class="card">
      <span class="eyebrow">Document 1</span>
      <h2 style="margin:8px 0 8px">Summary of Benefits and Coverage</h2>
      <p class="say-sm" style="font-size:16px;margin-bottom:18px">Explains what your plan covers and what you'll pay.</p>
      <span class="eyebrow" style="display:block;margin-bottom:9px">Usually contains</span>
      <div class="pills" style="margin-bottom:18px">
        <span class="pill">Deductible</span><span class="pill">Copays</span><span class="pill">Coinsurance</span><span class="pill">Out-of-pocket max</span>
      </div>
      <div class="where" style="margin-bottom:18px">
        <span class="eyebrow" style="display:block;margin-bottom:6px">Where to find it</span>
        <ul><li>Your employer's benefits portal</li><li>Your insurance company's website</li><li>Your insurance app</li><li>The paperwork from when you enrolled</li></ul>
      </div>
      <button class="btn wide" data-act="step" data-v="2">Upload my SBC</button>
    </div>
    <div class="card" style="margin-top:14px">
      <span class="eyebrow">Document 2</span>
      <h2 style="margin:8px 0 8px">Explanation of Benefits</h2>
      <p class="say-sm" style="font-size:16px;margin-bottom:16px">Shows what happened after a visit — what was charged, what insurance paid, what's left for you.</p>
      <div class="callout" style="margin-bottom:18px"><b>This is not a bill.</b> Nothing is due when you get one.</div>
      <button class="btn wide" data-act="step" data-v="2">Upload my EOB</button>
    </div>
    <button class="btn quiet wide" style="margin-top:14px" data-act="manual">I don't have either document →</button></div>`;

  if(step===2) return rail(32,'Upload')+`<div class="stagger">
    <h1>Add your documents.</h1>
    <p class="say" style="margin:14px 0 22px">A photo works fine. We'll read them and pull out the numbers so you don't have to.</p>
    <input type="file" id="fileInput" accept=".pdf,image/png,image/jpeg" style="display:none">
    <button class="drop" data-act="pickfile">
      <span class="ic">⬆</span>
      <h3>Choose a file or take a photo</h3>
      <span class="eyebrow" style="display:block;margin-top:8px">PDF · PNG · JPEG · CAMERA</span>
    </button>
    <button class="btn quiet wide" style="margin-top:18px" data-act="manual">Skip — I'll answer questions instead</button></div>`;

  if(step===3) return rail(48,'Reading')+`<div style="padding:6vh 0" id="proc">
    ${PROC.map((t,i)=>`<div class="proc-l" data-i="${i}"><span class="spin" style="visibility:hidden"></span><span>${t}</span></div>`).join('')}</div>`;

  if(step===4){ const c=counts(); return rail(62,'What we found')+`<div class="stagger">
    <h1>We found ${c.total} pieces of information.</h1>
    <p class="say" style="margin:14px 0 22px">Here's what we could and couldn't read. You'll get the last word on all of it.</p>
    <div class="tally">
      <div class="tally-r"><span class="dot v"></span><span class="num" style="font-size:19px;min-width:24px">${c.v}</span><span class="say-sm" style="font-size:16px">read clearly</span></div>
      <div class="tally-r"><span class="dot c"></span><span class="num" style="font-size:19px;min-width:24px">${c.c}</span><span class="say-sm" style="font-size:16px">worth a second look</span></div>
      <div class="tally-r"><span class="dot m"></span><span class="num" style="font-size:19px;min-width:24px">${c.m}</span><span class="say-sm" style="font-size:16px">not in your documents</span></div>
    </div>
    <button class="btn wide" style="margin-top:22px" data-act="startconf">Review what we found <span class="arw">→</span></button></div>`; }

  if(step===5){ const k=confQ[ci], f=PLAN.fields[k], m=FIELDS[k];
    const src=f.source?`Found in your ${f.source.doc_type} · page ${f.source.page}`:'You entered this';
    return rail(78,'Confirming')+`<div class="stagger">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span class="eyebrow">${ci+1} of ${confQ.length}</span>
      <span class="chip c"><span class="dot c"></span>Worth a check</span></div>
    <h1>Does this look right?</h1>
    <div class="card" style="margin:18px 0">
      <div style="font-size:15px;font-weight:600;color:var(--ink-2)">${m.l}</div>
      <div class="big-v num">${editing?`<input id="ev" value="${esc(f.value??'')}" inputmode="${m.f==='money'||m.f==='pct'?'decimal':'text'}">`:fmt(k,f.value)}</div>
      <p class="say">${m.say||''}</p>
      <div class="source"><span class="dot c"></span>${src}</div>
    </div>
    <div class="rowbtns">
      <button class="btn ghost" data-act="${editing?'saveedit':'edit'}">${editing?'Save':'Edit'}</button>
      <button class="btn" data-act="accept">Looks correct</button></div>
    <button class="btn quiet wide" style="margin-top:10px" data-act="skipconf">Skip for now</button></div>`; }

  const k=manQ[mi], m=FIELDS[k], left=manQ.length-mi;
  return rail(90,'Details')+`<div class="stagger">
    <span class="eyebrow">Question ${mi+1} of ${manQ.length}</span>
    <h1 style="margin:10px 0 24px">${mi===0?`We only need ${left} more detail${left>1?'s':''}.`:'One at a time.'}</h1>
    <div class="card">
      <h2 style="margin-bottom:12px">${m.q||m.l}</h2>
      <p class="say" style="margin-bottom:22px">${m.say||''}</p>
      ${m.f==='bool'
        ? `<div class="choices">
             <button class="choice" data-act="pick" data-v="1">Yes</button>
             <button class="choice" data-act="pick" data-v="0">No</button>
             <button class="choice" data-act="pick" data-v="x">Not sure</button></div>`
        : `<input class="q-in" id="mv" inputmode="${m.f==='money'||m.f==='pct'?'decimal':'text'}" placeholder="${m.f==='pct'?'0%':m.f==='money'?'$0.00':''}" aria-label="${m.l}">`}
      ${m.w?`<details class="help"><summary>Where do I find this?</summary>
        <div class="bd"><div class="where"><ul>${m.w.map(x=>`<li>${x}</li>`).join('')}</ul></div></div></details>`:''}
    </div>
    <button class="btn wide" style="margin-top:18px" data-act="submitman">Continue <span class="arw">→</span></button>
    <button class="btn quiet wide" style="margin-top:6px" data-act="unsure">I'm not sure — skip this</button></div>`;
}

function counts(){ const v=Object.values(PLAN.fields);
  return {total:v.length, v:v.filter(f=>f.confidence==='verified').length,
          c:v.filter(f=>f.confidence==='needs_confirmation').length,
          m:v.filter(f=>f.confidence==='missing').length}; }

async function runProc(){
  const els=[...document.querySelectorAll('.proc-l')];

  // Kick off the real upload in parallel with the reading animation --
  // whichever finishes last gates the transition to step 4.
  const uploadPromise = (async()=>{
    if(API.mode!=='live' || !pickedFile) return null;
    try{
      const fd=new FormData(); fd.append('files',pickedFile);
      const r=await fetch(API.base+'/api/documents',{method:'POST',body:fd,credentials:'include'});
      if(!r.ok) return null;
      const extractionRes=await fetch(API.base+'/api/extraction',{credentials:'include'});
      return extractionRes.ok ? await extractionRes.json() : null;
    }catch(e){ return null; }
  })();

  for(const el of els){
    el.classList.add('on'); el.querySelector('.spin').style.visibility='visible';
    await wait(640);
    el.querySelector('.spin').outerHTML='<span class="dot v pop"></span>';
  }
  await wait(380);

  const extracted = await uploadPromise;
  // Falls back to the mock dataset if extraction failed or wasn't
  // attempted (manual/demo path) -- graceful degradation, never a dead end.
  PLAN = extracted || structuredClone(EXTRACTED);
  pickedFile=null;
  await persist(); step=4; render();
}

/* ── dashboard ──────────────────────────────────────────── */
const COVER=['copay_primary','copay_specialist','copay_urgent_care','copay_er','rx_generic','coinsurance'];

function vDash(){
  const ded=val('deductible_individual'), used=val('deductible_used')||0;
  const rem=ded?Math.max(0,ded-used):null;
  const gaps=Object.keys(PLAN.fields).filter(k=>PLAN.fields[k].confidence==='missing');
  return `<div class="stagger">
    <div>
      <span class="eyebrow">Your health plan</span>
      <h1 style="margin:10px 0 4px">${has('plan_name')?val('plan_name'):'Your plan'}</h1>
      <p class="say">${has('carrier')?val('carrier'):'Insurance company not added'}${has('plan_type')?' · '+val('plan_type'):''}</p>
    </div>
    <div class="panel" style="margin-top:22px">
      <span class="eyebrow">Healthcare snapshot</span>
      <div class="hero-n num" data-count="${rem??0}">${rem!=null?money(0):'—'}</div>
      <p class="hero-l">left on your deductible before your plan starts sharing more of the cost</p>
      <div class="meter">
        <div class="meter-t"><span class="l">Deductible</span><span class="v">${money(used)} of ${fmt('deductible_individual',ded)}</span></div>
        <div class="track"><div class="fill a" data-w="${ded?Math.min(100,used/ded*100):0}"></div></div>
      </div>
      <div class="meter">
        <div class="meter-t"><span class="l">Out-of-pocket maximum</span><span class="v">${money(val('oop_spent')||0)} of ${fmt('oop_max_individual',val('oop_max_individual'))}</span></div>
        <div class="track"><div class="fill b" data-w="${val('oop_max_individual')?Math.min(100,(val('oop_spent')||0)/val('oop_max_individual')*100):0}"></div></div>
      </div>
      <div class="cells">
        ${[['Monthly premium','monthly_premium'],['Deductible','deductible_individual'],['Out-of-pocket max','oop_max_individual'],['HSA','hsa_eligible']]
          .map(([l,k])=>`<div class="cell"><div class="l">${l}</div><div class="v">${fmt(k,val(k))}</div></div>`).join('')}
      </div>
    </div>
    <div class="sec"><h2>What things cost</h2><span class="eyebrow">In-network</span></div>
    <div class="grid g4">
      ${COVER.map(k=>{ const f=PLAN.fields[k];
        if(f.value==null) return `<div class="cov gap" data-act="fill" data-k="${k}"><div class="l">${FIELDS[k].l}</div><div class="v">Add this</div></div>`;
        return `<div class="cov"><div class="l">${FIELDS[k].l}</div><div class="v">${fmt(k,f.value)}</div>
          <div class="say-sm" style="font-size:13px;margin-top:3px">${k==='coinsurance'?'Plan pays '+(100-f.value)+'%':'Per visit'}</div></div>`;
      }).join('')}
    </div>
    ${gaps.length?`
      <div class="card" style="margin-top:16px;border:1.5px dashed var(--clay);background:var(--clay-soft);box-shadow:none">
        <span class="chip m" style="background:#fff"><span class="dot m"></span>${gaps.length} still missing</span>
        <h2 style="margin:14px 0 6px">Add the rest whenever you like.</h2>
        <p class="say">Your dashboard works without these — it just gets more accurate with them.</p>
        <button class="btn ghost" style="margin-top:18px" data-act="fillall">Fill in ${gaps.length} detail${gaps.length>1?'s':''}</button>
      </div>`:`
      <div class="card" style="margin-top:16px;border-color:var(--pine);background:var(--pine-soft);box-shadow:none">
        <span class="chip v" style="background:#fff"><span class="dot v"></span>Complete</span>
        <h2 style="margin:14px 0 6px">Everything's in.</h2>
        <p class="say">All ${counts().total} details are recorded.</p></div>`}
    <div class="rowbtns" style="margin-top:20px">
      <button class="btn ghost" data-act="restart">Start over</button>
      <button class="btn" data-act="gocompare">Compare with other plans <span class="arw">→</span></button>
    </div>
  </div>`; }

function animateDash(){
  requestAnimationFrame(()=>{
    document.querySelectorAll('.fill').forEach(f=>setTimeout(()=>f.style.width=f.dataset.w+'%',180));
    const el=document.querySelector('[data-count]'); if(!el)return;
    const target=+el.dataset.count; if(!target)return;
    const t0=performance.now(), dur=1000;
    (function tick(t){ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
      el.textContent=money(target*e); if(p<1)requestAnimationFrame(tick); })(t0);
  });
}

/* ── compare ────────────────────────────────────────────── */
const PLANS=[
  {n:'Gold PPO',i:'Blue Cross Blue Shield',m:'Gold PPO',p:245,d:2000,o:6500,c:20,you:1},
  {n:'Silver PPO 2500',i:'Blue Cross Blue Shield',m:'Silver PPO',p:186,d:4500,o:8700,c:30},
  {n:'Platinum Select',i:'Harvard Pilgrim',m:'Platinum HMO',p:360,d:750,o:4000,c:10},
  {n:'Bronze HSA',i:'Tufts Health Plan',m:'Bronze EPO',p:128,d:7000,o:9200,c:40}];
const COL=['#14231C','#1C6B4E','#9A6A15','#A85039'];
const PRE=[['A healthy year',800],['A few visits',3000],['Ongoing condition',12000],['Surgery',38000]];
const share=(s,p)=>s<=0?0:Math.min(Math.min(s,p.d)+Math.max(0,s-p.d)*p.c/100,p.o);
const tot=(s,p)=>p.p*12+share(s,p);

function chart(){
  const W=880,H=320,L=62,R=16,T=14,B=40,mx=60000;
  const my=Math.max(...PLANS.map(p=>tot(mx,p)))*1.06;
  const X=v=>L+v/mx*(W-L-R), Y=v=>H-B-v/my*(H-T-B);
  let s='';
  for(let i=0;i<=3;i++){ const vv=my*i/3, py=Y(vv);
    s+=`<line x1="${L}" y1="${py}" x2="${W-R}" y2="${py}" stroke="#E2E9DE"/>`;
    s+=`<text x="${L-10}" y="${py+4}" text-anchor="end" font-family="Roboto Mono,monospace" font-size="11" fill="#8C9C93">${money(vv)}</text>`; }
  for(let g=0;g<=mx;g+=20000)
    s+=`<text x="${X(g)}" y="${H-14}" text-anchor="middle" font-family="Roboto Mono,monospace" font-size="11" fill="#8C9C93">${g?'$'+g/1000+'k':'$0'}</text>`;
  PLANS.forEach((p,i)=>{ let d='';
    for(let v=0;v<=mx;v+=1000) d+=(v?'L':'M')+X(v).toFixed(1)+' '+Y(tot(v,p)).toFixed(1);
    s+=`<path class="chart-line" style="animation-delay:${i*.09}s" d="${d}" fill="none" stroke="${COL[i]}" stroke-width="${p.you?3.2:2}" stroke-linejoin="round" stroke-linecap="round"/>`; });
  s+=`<line x1="${X(spend)}" y1="${T}" x2="${X(spend)}" y2="${H-B}" stroke="#14231C" stroke-dasharray="4 5" opacity=".4"/>`;
  PLANS.forEach((p,i)=>s+=`<circle cx="${X(spend)}" cy="${Y(tot(spend,p))}" r="${p.you?6:4.5}" fill="${COL[i]}" stroke="#fff" stroke-width="2.5"/>`);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img"><title>Total annual cost for each plan</title>${s}</svg>`;
}

function vCompare(){
  const me=PLANS[0], rank=[...PLANS].sort((a,b)=>tot(spend,a)-tot(spend,b));
  return `<div class="stagger">
    <div>
      <h1>How your plan compares.</h1>
      <p class="say lede" style="margin-top:14px">Plans don't sort into better and worse — they sort by how much care you use. Move the dial and watch the ranking change.</p>
    </div>
    <div class="panel" style="margin-top:26px">
      <span class="eyebrow">If you use this much care in a year</span>
      <div class="hero-n num" id="sv">${money(spend)}</div>
      <p class="hero-l" style="margin-bottom:20px">The total billed by doctors and pharmacies before insurance pays anything — not what comes out of your pocket.</p>
      <input type="range" id="sl" min="0" max="60000" step="500" value="${spend}" aria-label="Annual healthcare spending">
      <div class="scale"><span>$0</span><span>$15k</span><span>$30k</span><span>$45k</span><span>$60k</span></div>
      <div class="presets">${PRE.map(p=>`<button class="preset${spend===p[1]?' on':''}" data-act="pre" data-v="${p[1]}">${p[0]}</button>`).join('')}</div>
    </div>
    <div class="card" style="margin-top:14px" id="chartbox">${chart()}
      <div class="legend">${PLANS.map((p,i)=>`<span class="leg"><span class="sw" style="background:${COL[i]};height:${p.you?4:3}px"></span>${p.n}${p.you?' (yours)':''}</span>`).join('')}</div>
    </div>
    <div class="sec"><h2>At <span id="sv2" class="num">${money(spend)}</span> of care</h2><span class="eyebrow">Ranked by total yearly cost</span></div>
    <div class="grid g2" id="cards">${cards(rank,me)}</div>
    <div class="notice" style="margin-top:18px">These compare premiums and cost sharing only — not whether your doctors are in each network, which prescriptions are covered, or how each insurer handles claims. Emme won't tell you which plan to pick.</div>
  </div>`; }

function cards(rank,me){ return rank.map(p=>{
  const t=tot(spend,p), df=t-tot(spend,me);
  return `<div class="plan ${p.you?'you':p===rank[0]?'best':''}">
    ${p.you?'<span class="tag" style="background:var(--ink)">Your plan</span>':p===rank[0]?'<span class="tag" style="background:var(--pine)">Lowest total here</span>':''}
    <h3>${p.n}</h3>
    <p class="say-sm" style="margin-top:3px">${p.i} · ${p.m}</p>
    <div class="tot num">${money(t)}</div>
    <p class="say-sm">total for the year${p.you?'':` · <span style="color:${df>0?'var(--clay)':'var(--pine)'}">${money(Math.abs(df))} ${df>0?'more':'less'}</span>`}</p>
    <div class="rows">
      <div class="row"><span class="k">Premiums</span><span class="v">${money(p.p*12)}</span></div>
      <div class="row"><span class="k">You pay toward care</span><span class="v">${money(share(spend,p))}</span></div>
      <div class="row"><span class="k">Deductible</span><span class="v">${money(p.d)}</span></div>
      <div class="row"><span class="k">Out-of-pocket max</span><span class="v">${money(p.o)}</span></div>
      <div class="row"><span class="k">Share after deductible</span><span class="v">${p.c}%</span></div>
    </div></div>`; }).join(''); }

function updateCompare(){
  document.getElementById('sv').textContent=money(spend);
  document.getElementById('sv2').textContent=money(spend);
  const me=PLANS[0], rank=[...PLANS].sort((a,b)=>tot(spend,a)-tot(spend,b));
  document.getElementById('cards').innerHTML=cards(rank,me);
  const box=document.getElementById('chartbox');
  box.querySelector('svg').outerHTML=chart();
  box.querySelectorAll('.chart-line').forEach(l=>l.style.animation='none');
  document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('on',+b.dataset.v===spend));
}

/* ── chat ───────────────────────────────────────────────── */
const BOT=[
  [/deductible/i,'Your deductible is $2,000 — that is what you pay yourself before your plan starts sharing costs. You have paid $650 so far, so $1,350 to go this year.'],
  [/coinsurance|split|percent/i,'Coinsurance is the split after your deductible is met. Yours is 20%, so on a $1,000 bill you would pay $200 and your plan pays $800.'],
  [/hsa|savings/i,'A Health Savings Account lets you set money aside for medical costs before tax. Your Gold PPO is HSA eligible, so you can contribute to one.'],
  [/premium/i,'You pay $245 a month, which is $2,940 a year. That is due whether or not you see a doctor.'],
  [/out.?of.?pocket|maximum|\bmax\b/i,'Your out-of-pocket maximum is $6,500. Once you reach it, your plan covers 100% of covered care for the rest of the year. You are at $940.'],
  [/bronze|cheap/i,'Bronze has the lowest premium but a $7,000 deductible and 40% coinsurance. It wins in a healthy year and loses badly in an expensive one — drag the dial past about $6,000 and watch the lines cross.'],
  [/which|best|should i|recommend|pick/i,'I will not pick for you — that depends on your doctors, your prescriptions and your tolerance for a bad year, none of which is in these numbers. What I can show you is where each plan costs less. Try the dial on the compare page.'],
  [/compare|difference|versus|vs/i,'Against your Gold PPO: Platinum costs $115 more a month but has a $1,250 lower deductible. Bronze saves $117 a month but exposes you to $2,700 more in a bad year.'],
  [/copay|visit|doctor/i,'Your regular doctor visit is $25 and urgent care is $75. A specialist is $50 — that one came through as needing a check, so confirm it against your SBC.'],
  [/eob|explanation/i,'An Explanation of Benefits is not a bill. It arrives after a visit and shows what was charged, what your plan paid, and what is left for you.'],
  [/sbc|summary/i,'The Summary of Benefits and Coverage is the plan overview — deductible, copays, coinsurance and out-of-pocket maximum, usually in the first two pages.']
];
const reply=t=>(BOT.find(([r])=>r.test(t))||[,'I can explain deductibles, coinsurance, premiums, out-of-pocket maximums and HSAs, or walk you through how these plans differ. What would help?'])[1];

const chatEl=document.getElementById('chat'), logEl=document.getElementById('log');
let msgs=[];
function openChat(){
  chatEl.classList.add('open'); document.getElementById('fab').classList.add('gone');
  if(!msgs.length){ addMsg('a',"Ask me anything about your plan or these comparisons. I explain — I won't tell you which plan to buy."); showSuggs(); }
  setTimeout(()=>document.getElementById('chatIn').focus(),300);
}
function closeChat(){ chatEl.classList.remove('open'); render(); }
document.getElementById('fab').onclick=openChat;
document.getElementById('chatX').onclick=closeChat;

function addMsg(r,t){ const d=document.createElement('div'); d.className='msg '+(r==='u'?'u':'a');
  d.textContent=t; logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight; return d; }
function showSuggs(){
  const qs=["What's a deductible?","Why does Bronze cost more if I get sick?","Which plan should I pick?","What is an HSA?"];
  document.getElementById('suggs').innerHTML=qs.map(q=>`<button class="sugg">${q}</button>`).join('');
  document.querySelectorAll('.sugg').forEach(b=>b.onclick=()=>{ document.getElementById('suggs').innerHTML=''; send(b.textContent); });
}
async function send(text){
  if(!text.trim())return;
  document.getElementById('suggs').innerHTML='';
  addMsg('u',text); msgs.push({role:'user',content:text});
  const t=document.createElement('div'); t.className='msg a typing';
  t.innerHTML='<i></i><i></i><i></i>'; logEl.appendChild(t); logEl.scrollTop=logEl.scrollHeight;

  let out;
  if(API.mode==='live'){
    try{ const r=await fetch(API.base+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs}),credentials:'include'});
      out=(await r.json()).reply; }catch(e){ out=null; }
  }
  if(!out){ await wait(600+Math.random()*400); out=reply(text); }
  t.remove(); addMsg('a',out); msgs.push({role:'assistant',content:out});
}
document.getElementById('chatSend').onclick=()=>{ const i=document.getElementById('chatIn'); send(i.value); i.value=''; };
document.getElementById('chatIn').onkeydown=e=>{ if(e.key==='Enter'){ send(e.target.value); e.target.value=''; } };

/* ── actions ────────────────────────────────────────────── */
const MANUAL_ORDER=['carrier','plan_name','monthly_premium','deductible_individual','deductible_used',
  'oop_max_individual','coinsurance','copay_primary','copay_specialist','copay_urgent_care','copay_er','hsa_eligible'];

function startConfirm(){ confQ=Object.keys(PLAN.fields).filter(k=>PLAN.fields[k].confidence==='needs_confirmation');
  ci=0; editing=false; if(!confQ.length) return startManual(); step=5; render(); }
function startManual(){ manQ=MANUAL_ORDER.filter(k=>PLAN.fields[k]?.confidence==='missing'); mi=0; picked=null;
  if(!manQ.length) return go('dash'); step=6; render(); }

function wire(){
  document.querySelectorAll('[data-act]').forEach(el=>el.onclick=async()=>{
    const a=el.dataset.act;
    if(a==='login'||a==='signup'){
      const u=document.getElementById('u').value.trim().toLowerCase(), p=document.getElementById('p').value;
      if(!u||!p){ loginErr='Enter both a username and a password.'; render(); return; }
      if(API.mode!=='live'){ loginErr='Sign-in requires the live backend.'; render(); return; }
      try{
        const endpoint=a==='signup'?'/api/signup':'/api/login';
        const r=await fetch(API.base+endpoint,{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({username:u,password:p}),credentials:'include'});
        const body=await r.json();
        if(!r.ok||body.ok===false){ loginErr=body.error||"Those details didn't match. Try again."; render(); return; }
        loginErr='';
        try{
          const pr=await fetch(API.base+'/api/plan',{credentials:'include'});
          PLAN=pr.ok?await pr.json():null;
        }catch(e){ PLAN=null; }
        if(PLAN) Store.save(PLAN);
        go('home');
      }catch(e){ loginErr='Could not reach the server. Try again.'; render(); }
    }
    else if(a==='toggleSignup'){ signupMode=!signupMode; loginErr=''; render(); }
    else if(a==='goplan'){ if(PLAN) go('dash'); else { step=0; go('onboard'); } }
    else if(a==='gocompare') go('compare');
    else if(a==='gochat') openChat();
    else if(a==='pickfile'){
      const inp=document.getElementById('fileInput');
      inp.onchange=()=>{ if(inp.files.length){ pickedFile=inp.files[0]; step=3; render(); } };
      inp.click();
    }
    else if(a==='step'){ step=+el.dataset.v; render(); }
    else if(a==='back'){ if(step>0){ step=Math.max(0,step-1); render(); } else go('home'); }
    else if(a==='manual'){ PLAN=structuredClone(EXTRACTED);
      Object.keys(PLAN.fields).forEach(k=>{ PLAN.fields[k]={value:null,confidence:'missing',source:null} });
      await persist(); startManual(); }
    else if(a==='startconf') startConfirm();
    else if(a==='edit'){ editing=true; render(); setTimeout(()=>document.getElementById('ev')?.select(),40); }
    else if(a==='saveedit'){ const k=confQ[ci], m=FIELDS[k], raw=document.getElementById('ev').value;
      PLAN.fields[k].value=parseFieldValue(m,raw); editing=false; render(); }
    else if(a==='accept'){ const f=PLAN.fields[confQ[ci]];
      f.confidence=f.value==null?'missing':'verified'; f.edited_by_user=true;
      await persist(); editing=false; ci++; ci<confQ.length?render():startManual(); }
    else if(a==='skipconf'){ editing=false; ci++; ci<confQ.length?render():startManual(); }
    else if(a==='pick'){ document.querySelectorAll('.choice').forEach(c=>c.classList.remove('sel'));
      el.classList.add('sel'); picked=el.dataset.v; }
    else if(a==='submitman'){ const k=manQ[mi], m=FIELDS[k], f=PLAN.fields[k];
      if(m.f==='bool'){ if(picked===null)return; f.value=picked==='x'?null:picked==='1'; }
      else{ f.value=parseFieldValue(m,document.getElementById('mv')?.value||''); }
      f.confidence=f.value==null?'missing':'verified'; f.edited_by_user=true;
      await persist(); picked=null; mi++; mi<manQ.length?render():go('dash'); }
    else if(a==='unsure'){ picked=null; mi++; mi<manQ.length?render():go('dash'); }
    else if(a==='fill'){ manQ=[el.dataset.k]; mi=0; picked=null; step=6; go('onboard'); }
    else if(a==='fillall') startManual(), go('onboard');
    else if(a==='restart'){ Store.clear(); PLAN=null; step=0; ci=0; mi=0; go('onboard'); }
    else if(a==='pre'){ spend=+el.dataset.v; document.getElementById('sl').value=spend; updateCompare(); }
  });

  const sl=document.getElementById('sl');
  if(sl) sl.oninput=e=>{ spend=+e.target.value; updateCompare(); };
  const mv=document.getElementById('mv');
  if(mv){ mv.focus(); mv.onkeydown=e=>{ if(e.key==='Enter') document.querySelector('[data-act="submitman"]').click(); }; }
}

/* ── boot ───────────────────────────────────────────────── */
PLAN=Store.load();
render();
</script>
